# --- Textbooks ---------------------------------------------------
[[book]]
id = 75107
category = "Textbooks"
title = "Sketch of the Analytical Engine"
author = "Luigi Menabrea & Ada Lovelace"
year = 1843
description = """Luigi Menabrea's 1842 account of Charles Babbage's planned Analytical Engine, \
a general-purpose mechanical computer, translated from French by Ada Lovelace. Her own notes \
run to about three times the length of the paper. In them she explains how the machine could \
be programmed with punched cards and, in Note G, sets out step by step how it would calculate \
Bernoulli numbers, often called the first published computer program."""

