# The books in the store, picked by hand for variety: era, origin, genre,
# length, and more women and authors of colour than a "most popular" list.
# Guidelines: at most 2 books per author, English text only.
#
# Edit this file, then run:  python scripts/build_catalog.py
# Only new ids are fetched; existing ones are reused from catalog.json.
#
#   id        Project Gutenberg number (gutenberg.org/ebooks/<id>)
#   category  shelf in the app; the order here is the order of the chips
#   title     display title (Gutenberg's own titles are often long)
#   author    display name (Gutenberg lists translators and editors too)
#
# Optional, to fix a bad automatic match:
#   openlibrary  Open Library work to use, e.g. "/works/OL2564006W"
#   year         first-publication year to show
#   description  text to show when neither source has a good one

